name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN needs these to publish; id-token is what deploy-pages verifies with
permissions:
  contents: read
  pages: write
  id-token: write

# never let two deploys race; let a newer push win over a queued one
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # the *.selftest.ts files are handed straight to node, which needs
          # the type stripping added in 22.6
          node-version: 22
          cache: npm

      - run: npm ci

      # build:pages sets --base, because Pages serves an org repo from
      # /<repo>/ and the runtime asset paths would otherwise 404 at the root.
      # It also runs the selftests, so art that lets a pupil escape its eye
      # fails the deploy instead of reaching the venue.
      - run: npm run build:pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
